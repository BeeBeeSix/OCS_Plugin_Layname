[package]
name = "opencad-plugin-layname"
version = "0.1.2"
edition = "2021"
description = "Layer Names add-on for Open CAD Studio — import/export LMD layer maps, bulk rename layers, create and exchange layer filters."
license = "GPL-3.0-only"
repository = "https://github.com/BeeBeeSix/OCS_Plugin_Layname"

# A plugin is a C-ABI dynamic library the host loads at runtime (in its own
# runner process). `rlib` as well so `cargo test` can link the unit tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same pin as OCS_Plugin_RasterTools: v2026.46 release tag commit (Plugin API 23).
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "8b4d27046040b27eb07d3faed7b7472bd7bdaea9", features = ["host"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
