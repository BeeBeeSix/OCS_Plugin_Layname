[package]
name = "opencad-layname-plugin"
version = "0.2.0"
edition = "2021"
description = "Layer Names add-on for Open CAD Studio — import/export LMD layer maps, bulk rename layers, create and exchange layer filters."
license = "GPL-3.0-only"
repository = "https://github.com/BeeBeeSix/OCS_Plugin_Layname"

# A plugin is a C-ABI dynamic library the host loads at runtime (in its own
# runner process). `rlib` as well so `cargo test` can link the unit tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same pin as OCS_Plugin_RasterTools: v2026.47 release tag commit (Plugin API 28).
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "8e5f39f6ee0468a7e29260d57b5390d7d01207e8", features = ["host"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
